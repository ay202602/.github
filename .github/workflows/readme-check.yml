name: README Check

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/readme-check.yml"
      - ".markdownlint.json"
      - ".typos.toml"
      - ".lychee.toml"

permissions:
  contents: read

concurrency:
  group: readme-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: Markdownフォーマット
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "**/*.md"
          config: .markdownlint.json

  link-check:
    name: リンク切れ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml --no-progress "**/*.md"
          fail: true

  typos:
    name: タイポ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@v1.29.4
        with:
          config: .typos.toml
          files: .
