name: README Check

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/readme-check.yml"
      - ".github/workflows/markdown-check.yml"
      - ".markdownlint.json"
      - ".typos.toml"
      - ".lychee.toml"

permissions:
  contents: read

concurrency:
  group: readme-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-check:
    uses: ./.github/workflows/markdown-check.yml
